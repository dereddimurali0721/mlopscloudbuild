steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/demo-flask-app:$BUILD_ID', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/demo-flask-app:$BUILD_ID']

- name: 'gcr.io/$PROJECT_ID/demo-flask-app:$BUILD_ID'
  entrypoint: 'bash'
  args:
   - '-c'
   - |
     python -m pytest
  
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'py-bq-load'
    - '--image'
    - 'gcr.io/$PROJECT_ID/demo-flask-app:$BUILD_ID'
    - '--region'
    - 'us-central1'
    - '--allow-unauthenticated'
images:
- 'gcr.io/$PROJECT_ID/demo-flask-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY